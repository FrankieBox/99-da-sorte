<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>99 da sorte — Produto</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="wa-header">
    <div class="wa-header-top">
      <div class="wa-brand">
        <div class="wa-avatar">99</div>
        <div>
          <div class="wa-title">99 da sorte</div>
          <div class="wa-status">● participação online</div>
        </div>
      </div>
      <div class="wa-metrics">
        <span class="wa-pill">Bilhete: <strong id="lp-preco">R$ 1,00</strong></span>
      </div>
    </div>
  </header>

  <main class="wa-chat-bg">
    <div class="wa-container">
      <section id="status-retorno" class="wa-card oculto"></section>

      <section class="wa-card">
        <div class="wa-card-titulo" id="lp-titulo">Produto / Concurso em Breve</div>
        <p class="lp-subtitulo" id="lp-subtitulo">Base modelo pronta para receber produto e criativo.</p>
        <p class="lp-texto" id="lp-copy"></p>

        <div class="lp-regra-box">
          <strong>Como concorrer:</strong>
          <p id="lp-regra"></p>
          <span class="lp-meta">Modalidade do produto: <strong id="lp-modalidade-label">M (Milhar)</strong></span>
        </div>
      </section>

      <section class="wa-card">
        <div class="wa-card-titulo">Escolher Número e Dados de Contato</div>

        <form id="form-landing">
          <div id="lp-visores-selecao" class="bloco-alvo"></div>

          <div class="numpad" data-teclado="landing">
            <button type="button" class="tecla" data-digito="1">1</button>
            <button type="button" class="tecla" data-digito="2">2</button>
            <button type="button" class="tecla" data-digito="3">3</button>
            <button type="button" class="tecla" data-digito="4">4</button>
            <button type="button" class="tecla" data-digito="5">5</button>
            <button type="button" class="tecla" data-digito="6">6</button>
            <button type="button" class="tecla" data-digito="7">7</button>
            <button type="button" class="tecla" data-digito="8">8</button>
            <button type="button" class="tecla" data-digito="9">9</button>
            <button type="button" class="tecla tecla-acao" data-acao="limpar">Limpar</button>
            <button type="button" class="tecla" data-digito="0">0</button>
            <button type="button" class="tecla tecla-acao" data-acao="apagar">⌫</button>
          </div>

          <div class="campo">
            <label for="lead-nome">Seu Nome</label>
            <input type="text" id="lead-nome" placeholder="Nome completo" required />
          </div>

          <div class="campo">
            <label for="lead-contato">WhatsApp / Contato (para falar com você se ganhar)</label>
            <input type="text" id="lead-contato" placeholder="(11) 99999-9999" required />
          </div>

          <button type="submit" class="btn-wa-enviar">Ir para Checkout InfinitePay</button>
        </form>

        <p id="lp-feedback" class="feedback"></p>
      </section>
    </div>
  </main>

  <script src="produto.js"></script>
</body>
</html>
