<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ADM • 99 DA SORTE</title>
  <style>
    body {
      background: #050a14;
      color: #f1f5f9;
      font-family: system-ui, -apple-system, sans-serif;
      margin: 0;
      padding: 16px;
      display: flex;
      justify-content: center;
    }
    .container {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .card {
      background: #0d192e;
      border: 1px solid #1e3a6e;
      border-radius: 12px;
      padding: 14px;
    }
    h1, h2 {
      margin: 0 0 10px;
      color: #b4ff00;
      font-size: 1.1rem;
    }
    .row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }
    input, button {
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid #2563eb;
      font-size: 0.9rem;
    }
    input {
      background: #050a14;
      color: #fff;
    }
    button {
      background: #b4ff00;
      color: #050a14;
      font-weight: 800;
      border: none;
      cursor: pointer;
    }
    button.sec {
      background: #2563eb;
      color: #fff;
    }
    .concurso-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #172d54;
      gap: 8px;
    }
    .bilhete-item {
      background: #081121;
      border: 1px solid #1e3a6e;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 8px;
      font-size: 0.88rem;
      line-height: 1.45;
    }
    .premiado {
      border-color: #b4ff00;
      background: #102612;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="container">
    <div id="login-box" class="card">
      <h1>PAINEL ADM • 99 DA SORTE</h1>
      <div class="row">
        <input type="password" id="senha-adm" placeholder="Senha ADM" />
        <button onclick="entrarAdm()">ENTRAR</button>
      </div>
    </div>

    <div id="painel-adm" class="hidden">
      <div class="card" style="margin-bottom:14px;">
        <div class="row" style="justify-content:space-between;">
          <h1>CONTROLE DO DIA • 99 DA SORTE</h1>
          <a href="concursos-99.html" style="color:#93c5fd;font-weight:700;">ABRIR SITE ➔</a>
        </div>
        <div class="row">
          <input type="text" id="pix-chave" placeholder="Chave Pix Provisória" style="flex:1;" />
          <input type="text" id="pix-recebedor" placeholder="Nome Recebedor" />
          <button class="sec" onclick="salvarConfigPix()">SALVAR PIX PROVISÓRIO</button>
        </div>
      </div>

      <div class="card" style="margin-bottom:14px;">
        <h2>RESULTADOS DOS CONCURSOS (SINCRONIZA AUTOMÁTICO)</h2>
        <div id="adm-lista-concursos"></div>
      </div>

      <div class="card">
        <h2>BILHETES EMITIDOS HOJE (<span id="total-bilhetes">0</span>)</h2>
        <div id="adm-lista-bilhetes"></div>
      </div>
    </div>
  </div>

  <script>
    let senhaAtual = '';

    async function entrarAdm() {
      senhaAtual = document.getElementById('senha-adm').value;
      const ok = await carregarDadosAdm();
      if (ok) {
        document.getElementById('login-box').classList.add('hidden');
        document.getElementById('painel-adm').classList.remove('hidden');
      } else {
        alert('Senha incorreta.');
      }
    }

    async function carregarDadosAdm() {
      const resp = await fetch('/api/adm/dados', {
        headers: { 'x-adm-pass': senhaAtual }
      });
      if (!resp.ok) return false;

      const db = await resp.json();
      document.getElementById('pix-chave').value = db.pixProvisorioChave || '';
      document.getElementById('pix-recebedor').value = db.pixProvisorioRecebedor || '';

      const boxConcursos = document.getElementById('adm-lista-concursos');
      boxConcursos.innerHTML = db.concursos.map(c => `
        <div class="concurso-item">
          <div>
            <strong>#${c.numero} • ${c.horario}</strong><br/>
            <small>Atual: ${c.resultado ? 'DEZENA ' + c.resultado : 'Aguardando'}</small>
          </div>
          <div class="row">
            <input type="text" id="res-${c.id}" maxlength="2" placeholder="DZ" style="width:65px;text-align:center;" value="${c.resultado || ''}" />
            <button onclick="lancarResultado('${c.id}')">SALVAR</button>
          </div>
        </div>
      `).join('');

      document.getElementById('total-bilhetes').textContent = db.bilhetes.length;
      const boxBilhetes = document.getElementById('adm-lista-bilhetes');
      boxBilhetes.innerHTML = db.bilhetes.slice().reverse().map(b => `
        <div class="bilhete-item ${b.statusSorteio === 'PREMIADO' ? 'premiado' : ''}">
          <div class="row" style="justify-content:space-between;">
            <strong>ID: ${b.id} • Sorteio ${b.horario} • DZ ${b.dezena}</strong>
            <span>${b.statusSorteio}</span>
          </div>
          <div>${b.nome} (${b.telefone})</div>
          <div class="row" style="justify-content:space-between;margin-top:6px;">
            <span>Pgto: <strong>${b.statusPagamento}</strong></span>
            ${b.statusPagamento !== 'PAGO_CONFIRMADO'
              ? `<button class="sec" onclick="confirmarPgto('${b.id}')">CONFIRMAR PGTO</button>`
              : '<span>✔ Confirmado</span>'}
          </div>
        </div>
      `).join('');

      return true;
    }

    async function lancarResultado(concursoId) {
      const dz = document.getElementById(`res-${concursoId}`).value.trim();
      const resp = await fetch('/api/adm/resultado', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-adm-pass': senhaAtual
        },
        body: JSON.stringify({ concursoId, dezenaSorteada: dz })
      });
      if (resp.ok) {
        alert('Resultado sincronizado!');
        carregarDadosAdm();
      }
    }

    async function confirmarPgto(bilheteId) {
      const resp = await fetch('/api/adm/confirmar-pagamento', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-adm-pass': senhaAtual
        },
        body: JSON.stringify({ bilheteId })
      });
      if (resp.ok) {
        carregarDadosAdm();
      }
    }

    async function salvarConfigPix() {
      const chave = document.getElementById('pix-chave').value;
      const recebedor = document.getElementById('pix-recebedor').value;
      const resp = await fetch('/api/adm/config-pix', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'x-adm-pass': senhaAtual
        },
        body: JSON.stringify({ chave, recebedor })
      });
      if (resp.ok) {
        alert('Dados do QR Code Provisório atualizados!');
      }
    }
  </script>
</body>
</html>
