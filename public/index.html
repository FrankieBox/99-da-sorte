<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerenciador de Vendas - Grupos e Dezenas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>Gerenciador de Vendas (01–25 / 01–00)</h1>
    <div class="resumo-header">
      <span>Vendas: <strong id="total-vendas">0</strong></span>
      <span>Total: <strong id="total-valor">R$ 0,00</strong></span>
    </div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Registrar Venda</h2>

      <form id="form-venda">
        <div class="campo">
          <label for="modalidade">Modalidade</label>
          <select id="modalidade">
            <option value="grupo">Unidade de Grupo (01 a 25)</option>
            <option value="dezena">Unidade de Dezena (01 a 00)</option>
            <option value="terno_dezena">Terno de Dezena (3 dezenas)</option>
          </select>
        </div>

        <!-- Modo Grupo -->
        <div id="box-grupo" class="bloco-alvo">
          <div class="visor-box ativo" data-alvo="grupo">
            <span class="visor-label">Grupo (01–25)</span>
            <span class="visor-valor" id="disp-grupo">--</span>
          </div>
        </div>

        <!-- Modo Dezena -->
        <div id="box-dezena" class="bloco-alvo oculto">
          <div class="visor-box ativo" data-alvo="dezena">
            <span class="visor-label">Dezena (01–99 ou 00)</span>
            <span class="visor-valor" id="disp-dezena">--</span>
          </div>
        </div>

        <!-- Modo Terno -->
        <div id="box-terno" class="bloco-alvo oculto">
          <div class="terno-grid">
            <div class="visor-box ativo" data-alvo="terno-0">
              <span class="visor-label">1ª Dezena</span>
              <span class="visor-valor" id="disp-terno-0">--</span>
            </div>
            <div class="visor-box" data-alvo="terno-1">
              <span class="visor-label">2ª Dezena</span>
              <span class="visor-valor" id="disp-terno-1">--</span>
            </div>
            <div class="visor-box" data-alvo="terno-2">
              <span class="visor-label">3ª Dezena</span>
              <span class="visor-valor" id="disp-terno-2">--</span>
            </div>
          </div>
        </div>

        <!-- Campo Valor (em centavos via teclado numérico próprio) -->
        <div class="bloco-alvo">
          <div class="visor-box" data-alvo="valor">
            <span class="visor-label">Valor (mín. R$ 0,01)</span>
            <span class="visor-valor" id="disp-valor">R$ 0,00</span>
          </div>
        </div>

        <!-- Teclado Numérico Próprio -->
        <div class="numpad" id="numpad">
          <button type="button" class="tecla" data-digito="1">1</button>
          <button type="button" class="tecla" data-digito="2">2</button>
          <button type="button" class="tecla" data-digito="3">3</button>
          <button type="button" class="tecla" data-digito="4">4</button>
          <button type="button" class="tecla" data-digito="5">5</button>
          <button type="button" class="tecla" data-digito="6">6</button>
          <button type="button" class="tecla" data-digito="7">7</button>
          <button type="button" class="tecla" data-digito="8">8</button>
          <button type="button" class="tecla" data-digito="9">9</button>
          <button type="button" class="tecla tecla-acao" data-acao="limpar">Limpar</button>
          <button type="button" class="tecla" data-digito="0">0</button>
          <button type="button" class="tecla tecla-acao" data-acao="apagar">⌫</button>
        </div>

        <button type="submit" class="btn-primario">Confirmar Venda</button>
      </form>

      <p id="feedback-msg" class="feedback"></p>
    </section>

    <section class="card">
      <div class="card-header">
        <h2>Histórico de Vendas (BD JSON)</h2>
        <input type="text" id="filtro-vendas" placeholder="Filtrar por modalidade, dezena ou chave..." />
      </div>
      <div id="lista-vendas" class="lista-vendas"></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
